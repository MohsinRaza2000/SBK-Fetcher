name: fetch-stats

# The SBK statistics data pipeline. GitHub's runners are not blocked by the
# source (the SBK hosting server's IP is), so the fetch runs here and forwards
# each page to the portal's ingest endpoint. Gentle: one request a second.
# Each run fetches for up to 5.5 hours (newest makers/pages first) and commits its
# cursor, so the ~1.2M-row history fills over a few days of gentle 1-req/sec
# fetching. The cron re-queues it (the concurrency group keeps runs one-at-a-time,
# so a queued run starts when the previous finishes = near-continuous). After the
# first full sweep the script only re-reads the newest pages (the daily top-up).

on:
  schedule:
    - cron: '17 * * * *'      # a safety net only - the run chains itself, see the last step
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long this run fetches for (default 5.5 hours)'
        required: false
        default: '19800'

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # so a finished run can start the next one (see below)

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch a chunk and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
        run: python aaa_fetch.py --max-seconds ${{ github.event.inputs.seconds || '19800' }}
      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "pushed"; break; fi
            echo "push retry $i"; sleep 4
          done

      # Hand the baton on. The cron above is the intended trigger, but GitHub
      # skips short-interval schedules under load - on 14 September not one
      # scheduled run had fired in three and a half hours, so the chain would
      # have ended with this job and the feed would have stopped silently.
      # A finished run therefore starts the next one itself; the concurrency
      # group keeps them one at a time. The elapsed-time guard means a job that
      # dies in its first five minutes does NOT re-queue, so a broken run can
      # never spin in a loop.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # T0 is set by the first step of THIS job. github.run_started_at was
          # tried first and gave 943 minutes for a six-minute run, which would
          # have let a crash loop straight past the guard.
          mins=$(( ( $(date +%s) - ${T0:-0} ) / 60 ))
          echo "this run lasted ${mins} min"
          if [ "$mins" -ge 5 ]; then
            gh workflow run fetch.yml --ref main && echo "next run queued"
          else
            echo "too short - not re-queueing (guards against a crash loop)"
          fi
