# Fetch bid.aaajapan.com sales statistics and forward them to the SBK portal.
#
# TWO THINGS HOLD THIS BACK, AND THEY ARE DIFFERENT THINGS.
#
# How FAST — the gap between requests, 1.5s, the same the auction harvester uses.
# How MUCH — a hard allowance per UTC day, counted in the state file.
#
# The first account was closed on 16 September 2026 after this job pulled the
# source's whole price archive, 915,048 rows, in about forty hours. The gap was
# obeyed the entire time; there was simply no ceiling on the total. That ceiling
# is what stops the job now.
#
# WHAT A RUN DOES (since 19 September 2026). It compares counts: the portal says
# how many rows it holds per maker and sale day (free - our own server), page one
# of any window at the source says how many the source has, and only windows that
# are short get read. The newest five sale days are checked every 90 minutes; the
# history behind them is filled until only the day's reserve is left. See the long
# comment at the top of aaa_fetch.py for why (the source sorts by MODEL, not date,
# so the old "newest pages first" top-up re-read the same pages thirty times).
#
# WHY IT CHAINS ITSELF. GitHub skips short-interval schedules on shared runners -
# on 18 September not one of the 01:07, 02:07 or 03:07 runs happened. So a run
# that ends cleanly leaves `.next`, and the last step starts the next run. A run
# with nothing to ask WAITS INSIDE ITSELF (for the next check, or for 00:00 UTC
# when the day's allowance is spent) and asks the source nothing while it waits.
# No `.next` - a crash, a refusal, a short test run - and the chain stops; the
# cron below is the safety net that starts it again.
#
# TURNED AWAY AT THE DOOR (18 September 2026, 00:00 UTC). One GitHub machine got
# 403 on the very first page, before signing in - nothing identifies us there but
# that machine's address. The run ends quietly, leaves `.retry`, and the last step
# asks for another machine. Four refusals in a row fail the run on purpose, which
# e-mails the owner once.
#
# REFUSED AFTER SIGNING IN - the 16 September shape. Every reader stops, the run
# fails on purpose (one e-mail), and the source is left alone for 24 hours rather
# than being knocked on every schedule. Start a run by hand with resume = yes to
# end that wait once a person has looked.
#
# Both numbers are repository Variables — AAA_DAILY_BUDGET and AAA_RUN_LIMIT —
# so they change without a commit, and neither should be raised without the owner.

name: fetch-stats

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long this run may last (idle runs wait inside it)'
        required: false
        default: '1200'
      resume:
        description: 'yes = end the 24-hour stop after a refusal (only once a person has looked)'
        required: false
        default: 'no'

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # so a finished run can start the next one

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch what is short and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
          AAA_DAILY_BUDGET: ${{ vars.AAA_DAILY_BUDGET || '10000' }}
          AAA_RUN_LIMIT: ${{ vars.AAA_RUN_LIMIT || '600' }}
        run: python aaa_fetch.py --max-seconds ${{ github.event.inputs.seconds || '1200' }} ${{ github.event.inputs.resume == 'yes' && '--resume' || '' }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "pushed"; break; fi
            echo "push retry $i"; sleep 4
          done

      # Hand the baton on - only when the run asked for it (.next), or when it
      # was turned away at the door and wants another machine (.retry).
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .retry ]; then
            echo "turned away at the door - asking again from another machine in 30s"
            sleep 30
            gh workflow run fetch.yml --ref main && echo "next run queued"
          elif [ -f .next ]; then
            gh workflow run fetch.yml --ref main && echo "next run queued"
          else
            echo "no .next - not re-queueing (a stop after a refusal, a fault, or a short test run); the schedule starts it again"
          fi
