name: fetch-stats

# The SBK statistics data pipeline. GitHub's runners are not blocked by the
# source (the SBK hosting server's IP is), so the fetch runs here and forwards
# each page to the portal's ingest endpoint. Gentle: one request a second.
# Runs every 20 minutes and fetches an ~18-minute chunk (newest makers/pages
# first), so the ~1.2M-row history fills within about a day; after the first full
# sweep the script only re-reads the newest pages (the daily top-up).

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch a chunk and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
        run: python aaa_fetch.py --max-seconds 1100
      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || echo "nothing to commit"
          git push || echo "push skipped"
