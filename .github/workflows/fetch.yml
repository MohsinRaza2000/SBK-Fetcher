# Fetch bid.aaajapan.com sales statistics and forward them to the SBK portal.
#
# TWO THINGS HOLD THIS BACK, AND THEY ARE DIFFERENT THINGS.
#
# How FAST — the gap between requests, 1.5s, the same the auction harvester uses.
# How MUCH — a hard allowance per UTC day, counted in the state file.
#
# The first account was closed on 16 September 2026 after this job pulled the
# source's whole price archive, 915,048 rows, in about forty hours. The gap was
# obeyed the entire time; there was simply no ceiling on the total. That ceiling
# is now the thing that stops the job, and it is what makes everything below
# safe to do.
#
# WHY IT CHAINS ITSELF AGAIN. It was a plain cron for a few hours on 17 September
# and GitHub fired **not one** scheduled run: the day used 1,195 of its 5,000
# requests, and both runs that happened were started by hand. GitHub skips
# short-interval schedules on shared runners, which is the same thing that
# happened on 14 September. So a finished run starts the next one — but now the
# DAY'S ALLOWANCE is what ends the chain. When the purse is empty a run signs in,
# sees it, and stops in seconds; the elapsed-time guard then declines to
# re-queue, and the chain rests until tomorrow. Before the allowance existed this
# same chain ran for twenty-four hours a day, which is how forty hours took the
# whole archive.
#
# The cron is the belt to that braces: it restarts the chain each day. It fires
# twice an hour because GitHub skips schedules freely - on 18 September not one
# of the 01:07, 02:07 or 03:07 runs happened, and the day started four hours
# late. A run on a spent day never touches the source (the allowance is read
# before signing in), so the extra schedules cost the source nothing.
#
# TURNED AWAY AT THE DOOR (18 September 2026, 00:00 UTC). One GitHub machine got
# 403 on the very first page, before signing in - nothing identifies us there but
# that machine's address, and the next machine worked all morning. aaa_fetch.py
# now treats that as the machine's problem: the run ends quietly, leaves a
# `.retry` mark, and the step at the bottom asks for another machine straight
# away. Four refusals in a row fail the run on purpose, which e-mails the owner
# once. A refusal AFTER signing in still stops everything, as it always did.
#
# Both numbers are repository Variables — AAA_DAILY_BUDGET and AAA_RUN_LIMIT —
# so they change without a commit, and neither should be raised without the owner.

name: fetch-stats

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long this run may fetch for (the request limit usually stops it first)'
        required: false
        default: '1200'

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write
  actions: write        # so a finished run can start the next one

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Note the start time
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch a chunk and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
          AAA_DAILY_BUDGET: ${{ vars.AAA_DAILY_BUDGET || '10000' }}
          AAA_RUN_LIMIT: ${{ vars.AAA_RUN_LIMIT || '600' }}
        run: python aaa_fetch.py --max-seconds ${{ github.event.inputs.seconds || '1200' }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "pushed"; break; fi
            echo "push retry $i"; sleep 4
          done

      # Hand the baton on, unless this run did almost nothing - which is what a
      # run looks like once the day's allowance is spent, and also what a broken
      # run looks like. Either way it must not re-queue, or a crash would spin.
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mins=$(( ( $(date +%s) - ${T0:-0} ) / 60 ))
          echo "this run lasted ${mins} min"
          if [ -f .retry ]; then
            echo "turned away at the door - asking again from another machine in 30s"
            sleep 30
            gh workflow run fetch.yml --ref main && echo "next run queued"
          elif [ "$mins" -ge 5 ]; then
            gh workflow run fetch.yml --ref main && echo "next run queued"
          else
            echo "under five minutes - not re-queueing (spent allowance, or a fault)"
          fi
