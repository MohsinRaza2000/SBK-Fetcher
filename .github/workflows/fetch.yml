# Fetch bid.aaajapan.com sales statistics and forward them to the SBK portal.
#
# SHAPED LIKE THE AUCTION HARVESTER, on the owner's instruction of 17 September
# 2026 ("100% safe, jaisay action hai waisay hi static") — and for a reason paid
# for the day before.
#
# The first account was closed on 16 September 2026 after this job pulled the
# source's entire price archive, 915,048 rows, in about forty hours. The gap
# between requests was obeyed the whole time. Speed was never the problem: there
# was no ceiling on the TOTAL, while the auction harvester beside it had carried
# a daily budget from its first day.
#
# So this now works the way that one does:
#
#   a small cron, often            — every 20 minutes
#   a small run                    — AAA_RUN_LIMIT requests, then it stops
#   a hard day's allowance         — AAA_DAILY_BUDGET, counted in the state file
#   a stop on the first refusal    — any 403/429 halts every worker
#
# and there is NO self-chaining any more. A finished run used to start the next
# one immediately, which is how a day's work ended up in a single burst. Now the
# clock spreads it: once the day's allowance is spent, every later run signs in,
# sees the purse is empty and stops in a few seconds.
#
# Both numbers can be changed from the repository's Variables — AAA_DAILY_BUDGET
# and AAA_RUN_LIMIT — without touching any code. Neither should be raised without
# the owner saying so.

name: fetch-stats

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long this run may fetch for (the request limit usually stops it first)'
        required: false
        default: '1200'

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch a chunk and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
          # The ceilings. The defaults in aaa_fetch.py are the same numbers; these
          # are here so they can be changed from the repository's Variables page
          # without a commit.
          AAA_DAILY_BUDGET: ${{ vars.AAA_DAILY_BUDGET || '5000' }}
          AAA_RUN_LIMIT: ${{ vars.AAA_RUN_LIMIT || '600' }}
        run: python aaa_fetch.py --max-seconds ${{ github.event.inputs.seconds || '1200' }}

      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "pushed"; break; fi
            echo "push retry $i"; sleep 4
          done
