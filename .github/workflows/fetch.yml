name: fetch-stats

# The SBK statistics data pipeline. GitHub's runners are not blocked by the
# source (the SBK hosting server's IP is), so the fetch runs here and forwards
# each page to the portal's ingest endpoint. Gentle: one request a second.
# Each run fetches for up to 5.5 hours (newest makers/pages first) and commits its
# cursor, so the ~1.2M-row history fills over a few days of gentle 1-req/sec
# fetching. The cron re-queues it (the concurrency group keeps runs one-at-a-time,
# so a queued run starts when the previous finishes = near-continuous). After the
# first full sweep the script only re-reads the newest pages (the daily top-up).

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

concurrency:
  group: fetch-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch a chunk and forward it to the portal
        env:
          AAA_USER: ${{ secrets.AAA_USER }}
          AAA_PASS: ${{ secrets.AAA_PASS }}
          AAA_INGEST_TOKEN: ${{ secrets.AAA_INGEST_TOKEN }}
          AAA_INGEST_URL: ${{ secrets.AAA_INGEST_URL }}
        run: python aaa_fetch.py --max-seconds 19800
      - name: Save progress
        if: always()
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add aaa_fetch_state.json
          git commit -m "progress [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then echo "pushed"; break; fi
            echo "push retry $i"; sleep 4
          done
